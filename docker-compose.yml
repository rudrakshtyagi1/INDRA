services:
  backend:
    build:
      context: ./backend
    container_name: floodlab_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data/processed/tehri_simulations:/data/processed/tehri_simulations:ro
    environment:
      - DATA_DIR=/data/processed/tehri_simulations
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: floodlab_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
