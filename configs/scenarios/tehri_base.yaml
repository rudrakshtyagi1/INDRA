# Provenance notes:
#   - structural specs below: REPORTED (THDC India Limited / CWC published data)
#   - manning_n: ASSUMED (representative Himalayan gorge value)
#   - reach_length_km, valley_width_m: REPORTED (CWC survey)

scenario_id: tehri_base
name: "Tehri Dam - Overtopping Breach (Base)"
